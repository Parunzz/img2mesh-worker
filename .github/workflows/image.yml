name: image

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE*", "NOTICE", ".env.example", ".gitignore", "docker-compose.yml", "tests/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [hunyuan, trellis2]
    steps:
      # The image is large (torch + CUDA libraries); make room on the runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/img2mesh-worker
          tags: |
            type=raw,value=${{ matrix.engine }}
            type=raw,value=latest,enable=${{ matrix.engine == 'hunyuan' }}
            type=sha,format=short,prefix=${{ matrix.engine }}-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.engine }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache: the GitHub Actions cache caps at 10 GB per repo, and
          # these CUDA images evicted each other's layers mid-build.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/img2mesh-worker:buildcache-${{ matrix.engine }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/img2mesh-worker:buildcache-${{ matrix.engine }},mode=max,image-manifest=true,oci-mediatypes=true
