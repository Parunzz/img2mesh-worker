name: img2mesh

x-gpu-service: &gpu-service
  # ENGINE in .env picks the model: hunyuan (default) or trellis2. Each has its own image.
  image: ghcr.io/parunzz/img2mesh-worker:${ENGINE:-hunyuan}
  build:
    context: .
    dockerfile: Dockerfile.${ENGINE:-hunyuan}
  env_file:
    - path: .env
      required: false
  volumes:
    # Hunyuan3D-2.1 weights. Set HUNYUAN_DIR in .env to reuse a copy you already
    # have (the folder that contains hunyuan3d-dit-v2-1/); otherwise they are
    # downloaded once into ./models/Hunyuan3D-2.1.
    - ${HUNYUAN_DIR:-./models/Hunyuan3D-2.1}:/models/hy3dgen/tencent/Hunyuan3D-2.1
    # Or a ComfyUI checkpoints folder holding hunyuan_3d_v2.1.safetensors: set
    # COMFYUI_CHECKPOINTS in .env. When that file is there, it is used instead.
    - ${COMFYUI_CHECKPOINTS:-./models/checkpoints}:/checkpoints:ro
    # TRELLIS.2 weights (TRELLIS.2-4B/, TRELLIS-image-large/, dinov3/).
    - ${TRELLIS_DIR:-./models/trellis2}:/models/trellis2
    # Optional: ComfyUI's clip_vision folder, to reuse its DINOv3 file instead of downloading.
    - ${COMFYUI_CLIP_VISION:-./models/clip_vision}:/clip_vision:ro
    - cache:/models    # background-removal model and other small caches
    - ./data:/data     # your images in, STL files out (for `generate`)
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:
  # Pulls jobs from SITE_URL and keeps running across reboots.
  worker:
    <<: *gpu-service
    command: serve
    restart: unless-stopped

  # Test page at http://localhost:7860. Start with: docker compose --profile ui up ui
  ui:
    <<: *gpu-service
    command: ui
    ports:
      - "7860:7860"
    profiles: [ui]

volumes:
  cache:
